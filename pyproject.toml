[project]
name = "registre"
version = "0.1.0"
description = "Spanish → French translation in four registers, with grammar explanations"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "pandas>=2.2",
  "pyarrow>=15",
  "datasketch>=1.6",
  "spacy>=3.7,<4",
  "huggingface-hub>=0.24",
  "wandb>=0.17",
]

[project.optional-dependencies]
# Only on machines with an NVIDIA GPU (Grid5000 nodes, the RTX 3090 PC).
# Pin the exact version per machine once you know which one works with its CUDA driver.
gpu = ["vllm"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["registre"]
