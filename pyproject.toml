[project]
name = "registre"
version = "0.1.0"
description = "Spanish → French translation in four registers, with grammar explanations"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "pandas>=2.2",
  "pyarrow>=15",
  "datasketch>=1.6",
  "spacy>=3.7,<4",
  "huggingface-hub>=0.34",   # provides the `hf` CLI
  "wandb>=0.22.3",            # new-format W&B API keys need >= 0.22.3
  "openai>=1.40",
  "sacrebleu>=2.4",           # chrF for the collapse check            # client for vLLM's OpenAI-compatible server
  # spaCy Spanish model, pinned as a wheel (spacy download needs pip, which uv envs lack)
  "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true   # needed for the spaCy model URL above

[tool.hatch.build.targets.wheel]
packages = ["src/registre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["registre"]
