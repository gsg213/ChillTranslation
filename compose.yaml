# Everything runs in containers. From the host, use ./run <target>.
services:
  dev:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: registre-dev
    working_dir: /app
    volumes:
      - .:/app                                   # your code, edited on the host
      - venv:/opt/venv                           # Python packages (survive container restarts)
      - uv-cache:/opt/uv-cache                   # download cache, makes re-syncs fast
      - hf-cache-dev:/home/dev/.cache/huggingface
    env_file:
      - path: .env
        required: false
    # Podman (rootless): uncomment so files keep your ownership
    # userns_mode: keep-id

  vllm:
    build:                                       # official image + one fix, see Dockerfile.vllm
      context: .
      dockerfile: Dockerfile.vllm
      args:
        VLLM_TAG: ${VLLM_TAG:-set-VLLM_TAG-in-.env}
    image: registre-vllm:${VLLM_TAG:-unset}
    profiles: [gpu]                              # only started explicitly (./run vllm-up)
    ipc: host                                    # PyTorch needs shared memory
    ports:
      - "127.0.0.1:8000:8000"                    # reachable from this machine only
    volumes:
      - hf-cache-vllm:/root/.cache/huggingface   # model weights, downloaded once
    env_file:
      - path: .env
        required: false
    # A string, so VLLM_EXTRA_ARGS from .env can add flags (split like a shell command line).
    command: >-
      --model ${SMOKE_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      --max-model-len ${MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.8}
      ${VLLM_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Podman: replace the deploy block with
    # devices: [nvidia.com/gpu=all]

  languagetool:                                  # grammar checks for the day-2 filters
    image: erikvl87/languagetool:${LT_TAG:-6.8}
    profiles: [tools]                            # started with ./run lt-up
    environment:
      Java_Xms: 512m
      Java_Xmx: 2g
    # no ports: only other services reach it, at http://languagetool:8010

  qe:                                            # CometKiwi quality estimation (./run qe)
    build:
      context: .
      dockerfile: Dockerfile.qe
    image: registre-qe
    profiles: [gpu]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"  # output files belong to you, not root
    working_dir: /app
    entrypoint: ["python", "scripts/qe.py"]
    volumes:
      - .:/app
      - hf-cache-qe:/hf-cache
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache-qe:
  venv:
  uv-cache:
  hf-cache-dev:
  hf-cache-vllm:
